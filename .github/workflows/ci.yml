# Interim CI for the Jane Avenue build. agent-11 owns this file and extends it in M0
# (lint, OpenAPI drift check, Playwright e2e). Each job skips cleanly until its folder exists.
name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      JANE_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Backend lint and tests
        run: |
          if [ ! -f backend/requirements-dev.txt ]; then echo "backend not created yet - skipping"; exit 0; fi
          cd backend
          pip install -r requirements-dev.txt
          ruff check .
          python -m pytest -m "not live"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend typecheck, tests and build
        run: |
          if [ ! -f frontend/package.json ]; then echo "frontend not created yet - skipping"; exit 0; fi
          cd frontend
          npm ci
          npm run typecheck
          npm test -- --run
          npm run build
