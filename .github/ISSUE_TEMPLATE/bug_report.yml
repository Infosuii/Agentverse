name: Bug report
description: Something produced a wrong number, crashed, or behaved unexpectedly.
labels: ["bug"]
body:
  - type: input
    id: query
    attributes:
      label: Policy query
      description: The exact text you typed, if relevant.
      placeholder: What would happen if the UK increased corporation tax from 25% to 28%?
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [mock, cached, live]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
