[project]
name = "jane-avenue"
version = "0.1.0"
description = "Jane Avenue: AI-powered UK fiscal policy simulator (AgentVerse 2026)."
requires-python = ">=3.13"
license = { text = "MIT" }

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["jane_avenue*"]

[tool.ruff]
line-length = 120
target-version = "py313"
extend-exclude = [".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.ruff.lint.per-file-ignores]
# Appendix A is committed verbatim; keep its text byte-for-byte.
"jane_avenue/contracts/common.py" = ["UP017"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: calls live external APIs; skipped unless selected with -m live"]
addopts = "-m 'not live' --import-mode=importlib"
