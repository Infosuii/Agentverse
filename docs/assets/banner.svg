<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="440" viewBox="0 0 1280 440" role="img" aria-labelledby="title desc">
<title id="title">Jane Avenue. AI-powered UK fiscal policy simulator</title>
<desc id="desc">Monte Carlo fan chart of the behavioural corporation tax revenue change for a 25% to 28% rate rise, drawn from 40 of the model's 2,000 real draws.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0d1712"/><stop offset=".55" stop-color="#080d0a"/><stop offset="1" stop-color="#060907"/></linearGradient>
<radialGradient id="glowL" cx=".18" cy=".1" r=".6"><stop offset="0" stop-color="#60ba8d" stop-opacity=".2"/><stop offset="1" stop-color="#60ba8d" stop-opacity="0"/></radialGradient>
<radialGradient id="glowR" cx=".8" cy=".95" r=".5"><stop offset="0" stop-color="#12c281" stop-opacity=".1"/><stop offset="1" stop-color="#12c281" stop-opacity="0"/></radialGradient>
<pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".03"/></pattern>
<linearGradient id="bandOuter" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#3ec87d" stop-opacity=".22"/><stop offset="1" stop-color="#3ec87d" stop-opacity=".07"/></linearGradient>
<linearGradient id="edge" x1="0" x2="1"><stop offset="0" stop-color="#60ba8d" stop-opacity="0"/><stop offset=".5" stop-color="#60ba8d" stop-opacity=".8"/><stop offset="1" stop-color="#60ba8d" stop-opacity="0"/></linearGradient>
<style>
.sans{font-family:'IBM Plex Sans','Inter','Segoe UI',-apple-system,BlinkMacSystemFont,'Helvetica Neue',Helvetica,Arial,sans-serif}
.mono{font-family:'IBM Plex Mono','JetBrains Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.draw{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.8s cubic-bezier(.3,.7,.2,1) both}
.drawmain{stroke-dasharray:1;stroke-dashoffset:0;animation:draw 1.4s cubic-bezier(.3,.7,.2,1) 1.7s both}
.fade{animation:fade .6s ease-out both}
.band{animation:fade 1.2s ease-out 1.1s both}
.blink{animation:blink 1.2s steps(1) infinite}
@keyframes draw{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes blink{50%{opacity:.15}}
</style>
</defs>
<rect width="1280" height="440" rx="20" fill="url(#bg)"/>
<rect width="1280" height="440" rx="20" fill="url(#grid)"/>
<rect width="1280" height="440" rx="20" fill="url(#glowL)"/>
<rect width="1280" height="440" rx="20" fill="url(#glowR)"/>
<rect x=".75" y=".75" width="1278.5" height="438.5" rx="19.5" fill="none" stroke="#25312a" stroke-width="1.5"/>
<line x1="80" x2="1200" y1="1" y2="1" stroke="url(#edge)" stroke-width="1.5"/>

<g class="sans">
  <g transform="translate(64 92)">
    <rect width="262" height="28" rx="14" fill="#60ba8d" fill-opacity=".1" stroke="#60ba8d" stroke-opacity=".45"/>
    <circle cx="16" cy="14" r="4" fill="#60ba8d" class="blink"/>
    <text class="mono" x="29" y="18.5" font-size="12" letter-spacing="1.6" fill="#8fd6b1">UK FISCAL POLICY SIMULATOR</text>
  </g>
  <text x="58" y="206" font-size="88" font-weight="700" letter-spacing="-3" fill="#f2f6f3">Jane Avenue<tspan fill="#60ba8d">.</tspan></text>
  <text x="64" y="250" font-size="21" fill="#b9c8bd">Type a tax reform in plain English. Get grounded research,</text>
  <text x="64" y="279" font-size="21" fill="#b9c8bd">a transparent forecast and an independent audit.</text>
  <g class="mono" font-size="13">
    <g transform="translate(64 316)">
      <rect width="168" height="34" rx="6" fill="#0e1411" stroke="#25312a"/>
      <text x="14" y="22" fill="#60ba8d" font-weight="700">18</text><text x="40" y="22" fill="#97aa9c">audit checks</text>
    </g>
    <g transform="translate(242 316)">
      <rect width="162" height="34" rx="6" fill="#0e1411" stroke="#25312a"/>
      <text x="14" y="22" fill="#60ba8d" font-weight="700">2,000</text><text x="64" y="22" fill="#97aa9c">MC draws</text>
    </g>
    <g transform="translate(414 316)">
      <rect width="214" height="34" rx="6" fill="#0e1411" stroke="#25312a"/>
      <text x="14" y="22" fill="#60ba8d" font-weight="700">0</text><text x="32" y="22" fill="#97aa9c">numbers from the LLM</text>
    </g>
  </g>
</g>

